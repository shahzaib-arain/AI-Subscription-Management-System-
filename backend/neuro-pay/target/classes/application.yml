server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  # Loads backend/neuro-pay/.env (gitignored — see .env.example) so secrets
  # below resolve from environment variables instead of living in this
  # tracked file. "optional:" means the app still starts fine in an
  # environment where these are set as real OS/CI env vars instead.
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: neuro-pay

  datasource:
    url: jdbc:postgresql://localhost:5432/neuropay_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}   # Gmail App Password — see .env.example for how to disable/enable
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

application:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 86400000        # 24 hours in ms
    refresh-expiration: 604800000  # 7 days in ms

  frontend-url: http://localhost:8081   # Your mobile app deep link or web URL
  password-reset-token-expiry: 15      # minutes